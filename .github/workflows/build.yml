name: Build NartoDrama CloudStream plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout current CloudStream extension build template
        uses: actions/checkout@v4
        with:
          repository: recloudstream/extensions
          ref: cf16b3b45cda911a36ddca69f9acbe4763c6a4b1
          path: build-project

      - name: Keep only the NartoDrama module
        shell: bash
        run: |
          find build-project -mindepth 1 -maxdepth 1 -type d \
            ! -name ".git" ! -name "gradle" -exec rm -rf {} +
          cp -R source/NartoDrama build-project/NartoDrama

      - name: Use published CloudStream API compile stubs
        shell: bash
        run: |
          python3 - <<'PY'
          path = "build-project/build.gradle.kts"
          with open(path, "r", encoding="utf-8") as file:
              content = file.read()
          content = content.replace(
              '        implementation("com.github.recloudstream.cloudstream:library:-SNAPSHOT")',
              '        implementation("com.lagradost:cloudstream3:pre-release")'
          )
          with open(path, "w", encoding="utf-8") as file:
              file.write(content)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Build plugin
        working-directory: build-project
        run: |
          chmod +x gradlew
          ./gradlew NartoDrama:make makePluginsJson

      - name: Upload CloudStream plugin
        uses: actions/upload-artifact@v4
        with:
          name: NartoDrama-cs3-plugin
          path: |
            build-project/NartoDrama/build/*.cs3
            build-project/build/plugins.json
          if-no-files-found: error
          retention-days: 14
