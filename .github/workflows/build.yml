name: Build NartoDrama and DramaFren CloudStream extensions

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout current CloudStream extension build template
        uses: actions/checkout@v4
        with:
          repository: recloudstream/extensions
          ref: cf16b3b45cda911a36ddca69f9acbe4763c6a4b1
          path: build-project

      - name: Copy the two independent extension modules
        shell: bash
        run: |
          find build-project -mindepth 1 -maxdepth 1 -type d \\
            ! -name ".git" ! -name "gradle" -exec rm -rf {} +
          cp -R source/NartoDrama build-project/NartoDrama
          cp -R source/DramaFren build-project/DramaFren

      - name: Checkout CloudStream Gradle plugin source
        uses: actions/checkout@v4
        with:
          repository: recloudstream/gradle
          ref: 7cc64f92d88350ecbf775d6332de14dcaa71dcda
          path: gradle-plugin

      - name: Prepare local build dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plugin_build = Path("gradle-plugin/build.gradle.kts")
          plugin_text = plugin_build.read_text(encoding="utf-8")
          plugin_text = plugin_text.replace(
              '    implementation("com.github.vidstige:jadb:v1.2.1")\\n',
              ""
          )
          plugin_build.write_text(plugin_text, encoding="utf-8")

          # The ADB deploy task is not needed for GitHub Actions builds.
          adb_task = Path(
              "gradle-plugin/src/main/kotlin/com/lagradost/cloudstream3/gradle/tasks/DeployWithAdbTask.kt"
          )
          adb_task.write_text(
              """package com.lagradost.cloudstream3.gradle.tasks

          import org.gradle.api.DefaultTask

          abstract class DeployWithAdbTask : DefaultTask()
          """,
              encoding="utf-8"
          )

          root_build = Path("build-project/build.gradle.kts")
          root_text = root_build.read_text(encoding="utf-8")
          root_text = root_text.replace(
              'classpath("com.github.recloudstream:gradle:-SNAPSHOT")',
              'classpath("com.lagradost.cloudstream3:gradle:local-SNAPSHOT")'
          )
          root_text = root_text.replace(
              '        implementation("com.github.recloudstream.cloudstream:library:-SNAPSHOT")',
              '        val cloudstream by configurations\\n'
              '        cloudstream("com.lagradost:cloudstream3:pre-release")'
          )
          root_text = root_text.replace(
              '    repositories {\\n        google()',
              '    repositories {\\n        mavenLocal()\\n        google()',
              1
          )
          root_build.write_text(root_text, encoding="utf-8")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Build and publish CloudStream Gradle plugin locally
        working-directory: gradle-plugin
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Build both extensions
        working-directory: build-project
        run: |
          chmod +x gradlew
          ./gradlew NartoDrama:make DramaFren:make makePluginsJson

      - name: Prepare separate CloudStream repositories
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          plugins_file = Path("build-project/build/plugins.json")
          all_plugins = json.loads(plugins_file.read_text(encoding="utf-8"))

          configs = [
              ("NartoDrama", "builds", "Narto Drama",
               "CloudStream extension for Narto Drama"),
              ("DramaFren", "dramafren-builds", "DramaFren",
               "Independent CloudStream extension for DramaFren"),
          ]

          for module, branch, repo_name, description in configs:
              matches = [
                  item for item in all_plugins
                  if item.get("internalName") == module or item.get("name") == module
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one plugin entry for {module}; found {len(matches)}"
                  )

              item = dict(matches[0])
              item["url"] = f"https://raw.githubusercontent.com/{repo}/{branch}/{module}.cs3"

              build_dir = Path(f"build-project/{module}/build")
              binaries = list(build_dir.glob("*.cs3"))
              if len(binaries) != 1:
                  raise SystemExit(
                      f"Expected exactly one .cs3 package for {module}; found {len(binaries)}"
                  )

              dest = Path(f"publish-{module}")
              if dest.exists():
                  shutil.rmtree(dest)
              dest.mkdir()
              shutil.copy2(binaries[0], dest / f"{module}.cs3")
              (dest / "plugins.json").write_text(
                  json.dumps([item], indent=4) + "\\n",
                  encoding="utf-8"
              )
              manifest = {
                  "name": repo_name,
                  "description": description,
                  "manifestVersion": 1,
                  "pluginLists": [
                      f"https://raw.githubusercontent.com/{repo}/{branch}/plugins.json"
                  ],
              }
              (dest / "repo.json").write_text(
                  json.dumps(manifest, indent=2) + "\\n",
                  encoding="utf-8"
              )
          PY

      - name: Publish NartoDrama repository (independent)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd publish-NartoDrama
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Publish NartoDrama build ${GITHUB_SHA}"
          git branch -M builds
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push --force origin builds

      - name: Publish DramaFren repository (independent)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd publish-DramaFren
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Publish DramaFren build ${GITHUB_SHA}"
          git branch -M dramafren-builds
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push --force origin dramafren-builds

      - name: Upload both independent plugins
        uses: actions/upload-artifact@v4
        with:
          name: NartoDrama-and-DramaFren-separate-plugins
          path: |
            build-project/NartoDrama/build/*.cs3
            build-project/DramaFren/build/*.cs3
            build-project/build/plugins.json
          if-no-files-found: error
          retention-days: 14
