name: Build NartoDrama and DramaFren CloudStream plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout current CloudStream extension build template
        uses: actions/checkout@v4
        with:
          repository: recloudstream/extensions
          ref: cf16b3b45cda911a36ddca69f9acbe4763c6a4b1
          path: build-project

      - name: Keep the NartoDrama module (registers independent Narto Drama and DramaFren providers)
        shell: bash
        run: |
          find build-project -mindepth 1 -maxdepth 1 -type d \
            ! -name ".git" ! -name "gradle" -exec rm -rf {} +
          cp -R source/NartoDrama build-project/NartoDrama

      - name: Checkout CloudStream Gradle plugin source
        uses: actions/checkout@v4
        with:
          repository: recloudstream/gradle
          ref: 7cc64f92d88350ecbf775d6332de14dcaa71dcda
          path: gradle-plugin

      - name: Prepare local build dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plugin_build = Path("gradle-plugin/build.gradle.kts")
          plugin_text = plugin_build.read_text(encoding="utf-8")
          plugin_text = plugin_text.replace(
              '    implementation("com.github.vidstige:jadb:v1.2.1")\n',
              ""
          )
          plugin_build.write_text(plugin_text, encoding="utf-8")

          # The ADB deploy task is not needed for GitHub Actions builds.
          # Replace its implementation so the Gradle plugin can build without
          # downloading JADB from JitPack.
          adb_task = Path(
              "gradle-plugin/src/main/kotlin/com/lagradost/cloudstream3/gradle/tasks/DeployWithAdbTask.kt"
          )
          adb_task.write_text(
              """package com.lagradost.cloudstream3.gradle.tasks

          import org.gradle.api.DefaultTask

          abstract class DeployWithAdbTask : DefaultTask()
          """,
              encoding="utf-8"
          )

          root_build = Path("build-project/build.gradle.kts")
          root_text = root_build.read_text(encoding="utf-8")
          root_text = root_text.replace(
              'classpath("com.github.recloudstream:gradle:-SNAPSHOT")',
              'classpath("com.lagradost.cloudstream3:gradle:local-SNAPSHOT")'
          )
          root_text = root_text.replace(
              '        implementation("com.github.recloudstream.cloudstream:library:-SNAPSHOT")',
              '        val cloudstream by configurations\n'
              '        cloudstream("com.lagradost:cloudstream3:pre-release")'
          )
          root_text = root_text.replace(
              '    repositories {\n        google()',
              '    repositories {\n        mavenLocal()\n        google()',
              1
          )
          root_build.write_text(root_text, encoding="utf-8")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Build and publish CloudStream Gradle plugin locally
        working-directory: gradle-plugin
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Build plugin
        working-directory: build-project
        run: |
          chmod +x gradlew
          ./gradlew NartoDrama:make makePluginsJson

      - name: Publish CloudStream repository branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p publish
          cp build-project/NartoDrama/build/*.cs3 publish/
          cp build-project/build/plugins.json publish/
          cat > publish/repo.json <<EOF
          {
            "name": "Narto Drama + DramaFren",
            "description": "CloudStream extension repository with independent Narto Drama and DramaFren providers",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/plugins.json"
            ]
          }
          EOF
          cd publish
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Build ${GITHUB_SHA}"
          git branch -M builds
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push --force origin builds

      - name: Upload CloudStream plugin
        uses: actions/upload-artifact@v4
        with:
          name: NartoDrama-DramaFren-cs3-plugin
          path: |
            build-project/NartoDrama/build/*.cs3
            build-project/build/plugins.json
          if-no-files-found: error
          retention-days: 14
